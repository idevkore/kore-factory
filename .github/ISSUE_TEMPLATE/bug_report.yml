name: Bug report
description: Something in KORE Factory is broken or does not work as described.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, passwords or private project content (code, prompts, transcripts, file paths) into this form. Redact logs before you share them.
        Report security problems privately through the Security tab, not here. See SECURITY.md in the .github folder.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Start a session with ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA or branch you ran.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1
    validations:
      required: true
