name: Feature request
description: Suggest a change or a new capability.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The project is early and its maintainers set its direction, so not every idea will be taken up.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like KORE Factory to do instead?
    validations:
      required: true
